<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-QUEST | 6 Parts of Speech</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #fce7f3);
    color: #172033;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

header {
    background: white;
    border-radius: 25px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.1);
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 35px;
}

header p {
    color: #667085;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.stat {
    background: #f3f4f6;
    padding: 10px 16px;
    border-radius: 15px;
    font-weight: bold;
}

.game {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.1);
}

.board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
}

.cell {
    min-height: 75px;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-weight: bold;
    position: relative;
    padding: 8px;
}

.cell small {
    position: absolute;
    top: 5px;
    left: 7px;
    opacity: .5;
}

.player {
    border: 4px solid #111827;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,0,0,.25);
}

.start {
    background: #bbf7d0;
}

.finish {
    background: #fde68a;
}

.noun {
    background: #bfdbfe;
}

.pronoun {
    background: #bbf7d0;
}

.verb {
    background: #fef08a;
}

.adjective {
    background: #fed7aa;
}

.adverb {
    background: #ddd6fe;
}

.preposition {
    background: #fecdd3;
}

.bonus {
    background: #c7d2fe;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 14px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #111827;
    color: white;
}

button:hover {
    opacity: .9;
}

.answer {
    background: #f8fafc;
    color: #172033;
    border: 2px solid #e5e7eb;
    text-align: left;
}

.answer:hover {
    border-color: #6366f1;
}

.correct {
    background: #bbf7d0 !important;
    border-color: #22c55e !important;
}

.wrong {
    background: #fecaca !important;
    border-color: #ef4444 !important;
}

.question-box {
    margin-top: 20px;
}

.category {
    font-weight: bold;
    font-size: 18px;
}

.question {
    font-size: 21px;
    font-weight: bold;
    margin: 15px 0;
}

.feedback {
    margin-top: 15px;
    padding: 15px;
    border-radius: 15px;
    font-weight: bold;
}

.hidden {
    display: none;
}

.mastery {
    margin-top: 10px;
}

.mastery-item {
    padding: 10px;
    margin: 6px 0;
    background: #f8fafc;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 13px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 16px;
}

@media(max-width:800px) {

    .game {
        grid-template-columns: 1fr;
    }

    .board {
        grid-template-columns: repeat(4, 1fr);
    }

    header h1 {
        font-size: 28px;
    }
}

@media(max-width:500px) {

    .board {
        grid-template-columns: repeat(3, 1fr);
    }

    .cell {
        min-height: 65px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

<h1>🎮 G-QUEST</h1>

<p>
6 Parts of Speech • Play • Learn • Master
</p>

<div class="stats">

<div class="stat">
⭐ XP: <span id="score">0</span>
</div>

<div class="stat">
🎯 <span id="correct">0</span>/<span id="attempts">0</span>
</div>

<div class="stat">
🔥 Streak: <span id="streak">0</span>
</div>

</div>

</header>


<div class="game">

<div class="card">

<h2>🗺️ Grammar Board</h2>

<div id="board" class="board"></div>

<button id="rollButton" onclick="rollDice()">
🎲 ROLL DICE
</button>

<div id="questionBox" class="question-box hidden">

<div id="category" class="category"></div>

<div id="question" class="question"></div>

<div id="answers"></div>

<div id="feedback" class="feedback hidden"></div>

</div>

</div>


<div class="card">

<h2>👤 Player</h2>

<input
id="playerName"
placeholder="Enter your name"
>

<button onclick="startGame()">
🚀 START GAME
</button>

<h3>📊 Mastery</h3>

<div id="mastery" class="mastery"></div>

<h3>🏆 Status</h3>

<p id="status">
Ready to play!
</p>

</div>

</div>

</div>


<script>

const categories = {

noun: {
name: "🔵 Noun"
},

pronoun: {
name: "🟢 Pronoun"
},

verb: {
name: "🟡 Verb"
},

adjective: {
name: "🟠 Adjective"
},

adverb: {
name: "🟣 Adverb"
},

preposition: {
name: "🔴 Preposition"
}

};


const questions = [

/* NOUN */

{
c:"noun",
q:"Which word is a noun?",
a:["beautiful","school","quickly","run"],
x:1,
e:"School names a place."
},

{
c:"noun",
q:"The cat is sleeping. Which word is a noun?",
a:["sleeping","the","cat","is"],
x:2,
e:"Cat names an animal."
},

{
c:"noun",
q:"Which word names a person?",
a:["teacher","quickly","happy","run"],
x:0,
e:"Teacher names a person."
},

{
c:"noun",
q:"I bought a new ___.",
a:["beautiful","bag","quickly","run"],
x:1,
e:"Bag names a thing."
},

{
c:"noun",
q:"Which is a noun?",
a:["friendship","friendly","quickly","run"],
x:0,
e:"Friendship names an idea."
},

{
c:"noun",
q:"Kuala Lumpur is a busy ___.",
a:["city","quickly","run","beautiful"],
x:0,
e:"City is a noun."
},

{
c:"noun",
q:"Which word is NOT a noun?",
a:["garden","student","quickly","computer"],
x:2,
e:"Quickly is an adverb."
},

{
c:"noun",
q:"The boy has a bicycle. Which is a noun?",
a:["has","boy","the","a"],
x:1,
e:"Boy names a person."
},

{
c:"noun",
q:"Which word is a thing?",
a:["pencil","happily","write","she"],
x:0,
e:"Pencil names a thing."
},

{
c:"noun",
q:"Which is a noun?",
a:["hospital","beautiful","run","slowly"],
x:0,
e:"Hospital names a place."
},


/* PRONOUN */

{
c:"pronoun",
q:"___ am going to school.",
a:["I","Me","My","Mine"],
x:0,
e:"I is a subject pronoun."
},

{
c:"pronoun",
q:"Ali is tired because ___ studied late.",
a:["he","him","his","himself"],
x:0,
e:"He replaces Ali."
},

{
c:"pronoun",
q:"Sarah and I are friends. ___ play badminton.",
a:["We","Us","Our","Ours"],
x:0,
e:"We replaces Sarah and I."
},

{
c:"pronoun",
q:"The teacher spoke to ___.",
a:["he","his","him","they"],
x:2,
e:"Him is an object pronoun."
},

{
c:"pronoun",
q:"This book is ___.",
a:["my","mine","I","me"],
x:1,
e:"Mine shows possession."
},

{
c:"pronoun",
q:"Which is a pronoun?",
a:["beautiful","they","school","running"],
x:1,
e:"They is a pronoun."
},

{
c:"pronoun",
q:"The girls did it by ___.",
a:["themselves","their","them","they"],
x:0,
e:"Themselves is reflexive."
},

{
c:"pronoun",
q:"___ are my shoes.",
a:["Those","Them","They","Their"],
x:0,
e:"Those points to specific things."
},

{
c:"pronoun",
q:"Mr Lee gave ___ a prize.",
a:["we","us","our","ours"],
x:1,
e:"Us is an object pronoun."
},

{
c:"pronoun",
q:"Replace 'the students'.",
a:["it","he","they","she"],
x:2,
e:"They replaces plural people."
},


/* VERB */

{
c:"verb",
q:"The boys ___ football.",
a:["plays","play","playing","played"],
x:1,
e:"Boys is plural, so use play."
},

{
c:"verb",
q:"She ___ a book now.",
a:["read","reads","is reading","reading"],
x:2,
e:"Now indicates present continuous."
},

{
c:"verb",
q:"Which word is the verb?",
a:["baby","smiled","happily","the"],
x:1,
e:"Smiled shows an action."
},

{
c:"verb",
q:"We ___ to the museum yesterday.",
a:["go","goes","went","going"],
x:2,
e:"Yesterday requires went."
},

{
c:"verb",
q:"They ___ finished their work.",
a:["has","have","having","had"],
x:1,
e:"They takes have."
},

{
c:"verb",
q:"Which is a verb?",
a:["happiness","beautiful","dance","carefully"],
x:2,
e:"Dance can show an action."
},

{
c:"verb",
q:"He ___ tired last night.",
a:["is","are","was","be"],
x:2,
e:"He takes was."
},

{
c:"verb",
q:"My mother ___ dinner.",
a:["cook","cooks","cooking","cooked"],
x:1,
e:"Mother is singular."
},

{
c:"verb",
q:"The birds ___ over the trees.",
a:["fly","beautiful","quickly","birds"],
x:0,
e:"Fly shows an action."
},

{
c:"verb",
q:"The students ___ English now.",
a:["study","studied","are studying","studies"],
x:2,
e:"Now indicates present continuous."
},


/* ADJECTIVE */

{
c:"adjective",
q:"The girl wore a ___ dress.",
a:["beautiful","beautifully","beauty","beautify"],
x:0,
e:"Beautiful describes dress."
},

{
c:"adjective",
q:"It was a ___ morning.",
a:["was","cold","morning","it"],
x:1,
e:"Cold describes morning."
},

{
c:"adjective",
q:"He lives in a ___ house.",
a:["comfortably","comfort","comfortable","comforted"],
x:2,
e:"Comfortable describes house."
},

{
c:"adjective",
q:"The elephant is very ___.",
a:["large","largely","largeness","enlarge"],
x:0,
e:"Large describes elephant."
},

{
c:"adjective",
q:"Which word describes the car?",
a:["quickly","red","drive","they"],
x:1,
e:"Red describes car."
},

{
c:"adjective",
q:"She is a ___ student.",
a:["carefully","careful","care","caringly"],
x:1,
e:"Careful describes student."
},

{
c:"adjective",
q:"We saw an ___ movie.",
a:["exciting","excitedly","excitement","excite"],
x:0,
e:"Exciting describes movie."
},

{
c:"adjective",
q:"The soup is ___.",
a:["hot","hotly","heat","heating"],
x:0,
e:"Hot describes soup."
},

{
c:"adjective",
q:"Which is an adjective?",
a:["slowly","slow","slowness","run"],
x:1,
e:"Slow describes something."
},

{
c:"adjective",
q:"The test was ___.",
a:["difficulty","difficult","difficultly","difficultness"],
x:1,
e:"Difficult describes test."
},


/* ADVERB */

{
c:"adverb",
q:"She sings ___.",
a:["beautiful","beauty","beautifully","beautify"],
x:2,
e:"Beautifully tells how she sings."
},

{
c:"adverb",
q:"He ran ___.",
a:["quick","quickly","quicker","quickness"],
x:1,
e:"Quickly tells how he ran."
},

{
c:"adverb",
q:"They arrived ___.",
a:["they","arrived","early","the"],
x:2,
e:"Early tells when."
},

{
c:"adverb",
q:"The baby slept ___.",
a:["peaceful","peacefully","peace","peaceless"],
x:1,
e:"Peacefully tells how."
},

{
c:"adverb",
q:"She answered ___.",
a:["correct","correctly","correction","correctness"],
x:1,
e:"Correctly tells how."
},

{
c:"adverb",
q:"He spoke ___.",
a:["He","spoke","softly","voice"],
x:2,
e:"Softly tells how."
},

{
c:"adverb",
q:"We will meet ___.",
a:["tomorrow","tomorrow's","morrow","tomorrows"],
x:0,
e:"Tomorrow tells when."
},

{
c:"adverb",
q:"The students worked ___.",
a:["hard","hardness","hardly","harder"],
x:0,
e:"Hard tells how."
},

{
c:"adverb",
q:"Which is an adverb?",
a:["happy","happily","happiness","happier"],
x:1,
e:"Happily is an adverb."
},

{
c:"adverb",
q:"The dog barked ___.",
a:["loud","loudly","loudness","louder"],
x:1,
e:"Loudly tells how."
},


/* PREPOSITION */

{
c:"preposition",
q:"The book is ___ the table.",
a:["on","quickly","happy","they"],
x:0,
e:"On shows position."
},

{
c:"preposition",
q:"The cat is ___ the bed.",
a:["under","beautiful","runs","she"],
x:0,
e:"Under shows location."
},

{
c:"preposition",
q:"We arrived ___ school.",
a:["at","happy","quickly","they"],
x:0,
e:"At shows a specific place."
},

{
c:"preposition",
q:"The ball is ___ the box.",
a:["inside","beautifully","run","he"],
x:0,
e:"Inside shows location."
},

{
c:"preposition",
q:"She walked ___ the bridge.",
a:["across","careful","quickly","they"],
x:0,
e:"Across shows movement."
},

{
c:"preposition",
q:"The picture is ___ the wall.",
a:["on","softly","beautiful","run"],
x:0,
e:"On shows position."
},

{
c:"preposition",
q:"He sat ___ me.",
a:["beside","happy","quick","they"],
x:0,
e:"Beside means next to."
},

{
c:"preposition",
q:"The school is ___ the hospital and bank.",
a:["between","beautifully","run","she"],
x:0,
e:"Between is used for two places."
},

{
c:"preposition",
q:"The children ran ___ the classroom.",
a:["into","beautiful","quickly","they"],
x:0,
e:"Into shows movement inside."
},

{
c:"preposition",
q:"The bag is ___ the chair.",
a:["behind","beautiful","quickly","they"],
x:0,
e:"Behind shows position."
}

];


const path = [
"START",
"noun",
"noun",
"pronoun",
"verb",
"adjective",
"adverb",
"preposition",
"BONUS",
"noun",
"pronoun",
"verb",
"adjective",
"adverb",
"preposition",
"BONUS",
"noun",
"pronoun",
"verb",
"adjective",
"adverb",
"preposition",
"noun",
"verb",
"adjective",
"adverb",
"preposition",
"BONUS",
"noun",
"pronoun",
"verb",
"adjective",
"adverb",
"preposition",
"FINISH"
];


let position = 0;
let score = 0;
let correct = 0;
let attempts = 0;
let streak = 0;
let locked = false;

let mastery = {
noun:[0,0],
pronoun:[0,0],
verb:[0,0],
adjective:[0,0],
adverb:[0,0],
preposition:[0,0]
};


function startGame() {

    position = 0;
    score = 0;
    correct = 0;
    attempts = 0;
    streak = 0;
    locked = false;

    for(let key in mastery) {
        mastery[key] = [0,0];
    }

    document.getElementById("questionBox")
        .classList.add("hidden");

    document.getElementById("rollButton")
        .disabled = false;

    document.getElementById("status")
        .textContent = "Game started! Roll the dice.";

    render();

}


function render() {

    document.getElementById("score").textContent = score;

    document.getElementById("correct").textContent = correct;

    document.getElementById("attempts").textContent = attempts;

    document.getElementById("streak").textContent = streak;


    const board = document.getElementById("board");

    board.innerHTML = "";


    path.forEach((item,index) => {

        const cell = document.createElement("div");

        cell.classList.add("cell");


        if(item === "START") {
            cell.classList.add("start");
            cell.textContent = "🚀 START";
        }

        else if(item === "FINISH") {
            cell.classList.add("finish");
            cell.textContent = "🏆 FINISH";
        }

        else if(item === "BONUS") {
            cell.classList.add("bonus");
            cell.textContent = "⭐ BONUS";
        }

        else {
            cell.classList.add(item);
            cell.textContent = categories[item].name;
        }


        const number = document.createElement("small");

        number.textContent = index;

        cell.appendChild(number);


        if(index === position) {
            cell.classList.add("player");
        }


        board.appendChild(cell);

    });


    updateMastery();

}


function updateMastery() {

    const box = document.getElementById("mastery");

    box.innerHTML = "";


    for(let key in mastery) {

        const total = mastery[key][1];

        const right = mastery[key][0];

        let percentage = total === 0
            ? 0
            : Math.round((right / total) * 100);


        let icon = "⚪";

        if(percentage >= 80) {
            icon = "🟢";
        }

        else if(percentage >= 60) {
            icon = "🟡";
        }

        else if(total > 0) {
            icon = "🔴";
        }


        const div = document.createElement("div");

        div.className = "mastery-item";

        div.innerHTML =
            categories[key].name +
            " — " +
            percentage +
            "% " +
            icon;


        box.appendChild(div);

    }

}


function rollDice() {

    if(locked) return;


    const dice = Math.floor(Math.random() * 6) + 1;


    position += dice;


    if(position >= path.length - 1) {

        position = path.length - 1;

        render();

        finish();

        return;

    }


    render();


    const current = path[position];


    if(current === "BONUS") {

        score += 10;

        document.getElementById("status")
            .textContent = "⭐ Bonus! +10 XP";

        render();

        return;

    }


    showQuestion(current);

}


function showQuestion(category) {

    locked = true;

    document.getElementById("rollButton")
        .disabled = true;


    const available =
        questions.filter(q => q.c === category);


    const question =
        available[Math.floor(Math.random() * available.length)];


    document.getElementById("questionBox")
        .classList.remove("hidden");


    document.getElementById("category")
        .textContent =
        categories[category].name +
        " CHALLENGE";


    document.getElementById("question")
        .textContent = question.q;


    const answers =
        document.getElementById("answers");


    answers.innerHTML = "";


    question.a.forEach((answer,index) => {

        const button =
            document.createElement("button");


        button.className = "answer";


        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            answer;


        button.onclick = function() {

            checkAnswer(
                button,
                index,
                question,
                category
            );

        };


        answers.appendChild(button);

    });


    document.getElementById("feedback")
        .classList.add("hidden");

}


function checkAnswer(
    button,
    selected,
    question,
    category
) {

    if(!locked) return;


    locked = false;


    attempts++;

    mastery[category][1]++;


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(btn => {
        btn.disabled = true;
    });


    const feedback =
        document.getElementById("feedback");


    if(selected === question.x) {

        button.classList.add("correct");


        correct++;

        mastery[category][0]++;

        streak++;


        let points = 10;


        if(streak >= 3) {
            points += 5;
        }


        score += points;


        feedback.innerHTML =
            "✅ CORRECT! +" +
            points +
            " XP<br><small>" +
            question.e +
            "</small>";


        feedback.style.background =
            "#bbf7d0";


        document.getElementById("status")
            .textContent =
            "Great! Keep going 🔥";

    }


    else {

        button.classList.add("wrong");


        buttons[question.x]
            .classList.add("correct");


        streak = 0;


        feedback.innerHTML =
            "❌ NOT QUITE!<br>" +
            "Correct answer: <b>" +
            question.a[question.x] +
            "</b><br><small>" +
            question.e +
            "</small>";


        feedback.style.background =
            "#fecaca";


        document.getElementById("status")
            .textContent =
            "Keep practising! 💪";

    }


    feedback.classList.remove("hidden");


    render();


    setTimeout(function() {

        document.getElementById("questionBox")
            .classList.add("hidden");


        if(position >= path.length - 1) {

            finish();

        }

        else {

            locked = false;

            document.getElementById("rollButton")
                .disabled = false;

        }

    },1800);

}


function finish() {

    document.getElementById("rollButton")
        .disabled = true;


    const percentage =
        attempts === 0
        ? 0
        : Math.round(
            (correct / attempts) * 100
        );


    document.getElementById("status")
        .innerHTML =
        "🏆 FINISH! " +
        percentage +
        "% accuracy";


    setTimeout(function() {

        alert(
            "🏆 G-QUEST COMPLETE!\\n\\n" +
            "⭐ XP: " + score + "\\n" +
            "🎯 Accuracy: " + percentage + "%\\n" +
            "✅ Correct: " + correct +
            "/" + attempts
        );

    },300);

}


render();

</script>

</body>
</html>
